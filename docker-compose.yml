services:
  web:
    build: .
    restart: unless-stopped
    # Pin the outbound SMTP host to its origin IPv4 — resolving it through
    # Cloudflare gives an IPv6 anycast address where port 587 times out.
    extra_hosts: &app-extra-hosts
      - "outbound.evotechly.com:169.58.75.34" # pragma: allowlist secret
    ports:
      - "${PORT:-8000}:8000"
    environment: &app-environment
      APP_NAME: ${APP_NAME:-EvoSales}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Algiers}
      PORT: 8000
      DB_CONNECTION: ${DB_CONNECTION:-sqlite}
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-database/database.sqlite}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@evocrmapp.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-EvoCrm · Evotechly}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
      EVOCRM_SIGNUP_MODE: ${EVOCRM_SIGNUP_MODE:-invite}
      EVOCRM_SIGNUP_REQUEST_URL: ${EVOCRM_SIGNUP_REQUEST_URL:-mailto:hello@evotechly.com}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      EVOLUTION_BASE_URL: ${EVOLUTION_BASE_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-evosales}
      EVOLUTION_WEBHOOK_URL: ${EVOLUTION_WEBHOOK_URL:-}
      WA_BUSINESS_TOKEN: ${WA_BUSINESS_TOKEN:-}
      WA_BUSINESS_PHONE_NUMBER_ID: ${WA_BUSINESS_PHONE_NUMBER_ID:-}
      WA_BUSINESS_WABA_ID: ${WA_BUSINESS_WABA_ID:-}
      WA_BUSINESS_GRAPH_VERSION: ${WA_BUSINESS_GRAPH_VERSION:-v21.0}
      WA_BUSINESS_TOKEN_WEBHOOK: ${WA_BUSINESS_TOKEN_WEBHOOK:-}
      META_APP_ID: ${META_APP_ID:-}
    volumes: &app-volumes
      - .:/var/www/html
    command: >
      sh -c "php artisan serve --host=0.0.0.0 --port=$${PORT:-8000}"

  queue:
    build: .
    restart: unless-stopped
    extra_hosts: *app-extra-hosts
    environment: *app-environment
    volumes: *app-volumes
    command: >
      sh -c "php artisan queue:work --sleep=3 --tries=3 --backoff=3 --timeout=90 --max-time=3600"

  scheduler:
    build: .
    restart: unless-stopped
    extra_hosts: *app-extra-hosts
    environment: *app-environment
    volumes: *app-volumes
    command: >
      sh -c "php artisan schedule:work"

  # Optional. Cloud / Business API credentials only.
  # Do not create Baileys or QR instances against this service.
  evolution:
    image: evoapicloud/evolution-api:v2.2.3
    profiles: ["evolution"]
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-changeme}
      WA_BUSINESS_TOKEN_WEBHOOK: ${WA_BUSINESS_TOKEN_WEBHOOK:-}
      WA_BUSINESS_URL: ${WA_BUSINESS_URL:-https://graph.facebook.com}
      WA_BUSINESS_VERSION: ${WA_BUSINESS_GRAPH_VERSION:-v21.0}
      WA_BUSINESS_LANGUAGE: ${WA_BUSINESS_LANGUAGE:-fr}
      # Product constraint: EvoSales will only create WHATSAPP-BUSINESS instances.
      # Do not set session/QR/Baileys connection defaults here.
    volumes:
      - evolution_data:/evolution/instances

volumes:
  evolution_data:
